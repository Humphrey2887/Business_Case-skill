industry_research:
  industry_value_logic: "炼化—化纤是典型的连续流程重资产制造：价值来自'原料—产品加工价差'与'一体化协同+规模效应'；越往下游（差异化聚酯/功能新材料）附加值越高，越往上游越受原油与大宗价差周期支配"
  industry_revenue_model: "以'量×加工价差'为核心：营收随油价与产品价格同向波动，利润取决于价差（如炼油综合毛利、PX-石脑油价差、PTA加工费、聚酯现金流），因此营收下滑不必然利润下滑（600346 2025营收-14.93%但利润总额+6.81%即为例证）"
  industry_cost_structure:
    - item: "直接原材料（原油/石脑油/PX/MEG）"
      share: "约 80-90% 营业成本"
      amount: "n/a"
      source: "石化行业成本结构公开规律"
      confidence: "medium"
    - item: "能源动力（蒸汽/电/燃料气）"
      share: "约 5-10% 营业成本，是原料之外最大的可控成本项"
      amount: "n/a"
      source: "炼化行业能耗成本公开规律"
      confidence: "medium"
  industry_profit_drivers:
    - driver: "加工价差管理"
      logic: "在原料价格无法左右时，靠优化收率结构、产品切换、时机把握赚价差"
      evidence: "600346 2025营收降但利润升，价差与结构管理主导利润"
    - driver: "装置资产利用效率与稳定运行"
      logic: "重资产行业单位固定成本对开工率极敏感，非计划停车/降负荷直接吞噬利润"
      evidence: "炼化一体化装置连续运行是盈利前提（行业通识）"
    - driver: "能耗/碳排放强度"
      logic: "能耗双控与碳成本上升，单位产品能耗直接决定成本竞争力"
      evidence: "'十四五'能耗双控转碳排放双控政策方向（公开政策）"
    - driver: "产品结构向高附加值新材料升级"
      logic: "基础聚酯/PTA 同质化过剩，功能膜/可降解/锂电隔膜等提升毛利"
      evidence: "600346 新材料均价同比+9.84%（2026Q1），逆势为正"
  common_constraints:
    - constraint: "产能过剩与加工价差收窄"
      impact: "PTA、聚酯、部分炼化产品阶段性过剩，价差被压缩"
      evidence: "行业公开：2024-2025 石化行业进入周期性调整与结构性重构叠加期"
    - constraint: "能耗双控/碳排放约束"
      impact: "高能耗装置扩张与运行受政策约束，碳成本上升"
      evidence: "国家能耗双控向碳排放双控转型（公开政策）"
    - constraint: "原油/大宗价格剧烈波动"
      impact: "库存损益与价差风险大，对采购与排产时机要求高"
      evidence: "油价周期性波动（公开）"
  external_trends:
    - trend: "全球石化行业周期性调整+结构性重构叠加"
